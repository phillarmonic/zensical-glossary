name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Setup xdrun
        uses: phillarmonic/setup-drun@v2
        with:
          version: "v2"

      - name: List drun tasks
        run: xdrun --list

# Since this isn't to ingest in LLM context, show the whole log instead of only on failure
      - name: Run CI pipeline
        run: xdrun ci --task-mode normal
