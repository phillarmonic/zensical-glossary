[project]
name = "zensical-glossary"
version = "1.2.1"
description = "An enriched glossary extension for the Zensical site generator"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Phillarmonic Software" },
]
keywords = [
    "zensical",
    "markdown",
    "glossary",
    "documentation",
    "tooltip",
    "static-site",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Plugins",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "markdown>=3.6",
]

[project.entry-points."markdown.extensions"]
zensical_glossary = "zensical_glossary:GlossaryExtension"

[project.urls]
Homepage = "https://phillarmonic.github.io/zensical-glossary/"
Documentation = "https://phillarmonic.github.io/zensical-glossary/usage/"
Repository = "https://github.com/phillarmonic/zensical-glossary"
Issues = "https://github.com/phillarmonic/zensical-glossary/issues"
Changelog = "https://github.com/phillarmonic/zensical-glossary/blob/master/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "zensical_glossary",
    "tests",
    "docs",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
    "zensical.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["zensical_glossary"]

[dependency-groups]
dev = [
    "zensical>=0.0.51",
]
