[project]
name = "zensical-glossary"
version = "1.0.0"
description = "An enriched glossary extension for the Zensical site generator"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "markdown>=3.6",
]

[project.entry-points."markdown.extensions"]
zensical_glossary = "zensical_glossary:GlossaryExtension"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zensical_glossary"]

[dependency-groups]
dev = [
    "zensical>=0.0.51",
]
